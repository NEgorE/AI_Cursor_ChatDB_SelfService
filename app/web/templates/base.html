<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ChatDB SelfService{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a191e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23e8a33d' font-family='monospace'%3E%E2%96%B8_%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/zcode.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">&#9656;_</span> ChatDB<span class="brand-sub">SelfService</span></div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if nav == 'dashboard' else '' }}"><span class="nav-ico">&#9672;</span>Дашборд</a>
        <a href="/connections" class="{{ 'active' if nav == 'connections' else '' }}"><span class="nav-ico">&#9937;</span>Подключения</a>
        <a href="/triggers" class="{{ 'active' if nav == 'triggers' else '' }}"><span class="nav-ico">&#9889;</span>Триггеры</a>
        {% if is_admin %}
        <a href="/users" class="{{ 'active' if nav == 'users' else '' }}"><span class="nav-ico">&#9787;</span>Пользователи</a>
        <a href="/roles" class="{{ 'active' if nav == 'roles' else '' }}"><span class="nav-ico">&#128273;</span>Роли</a>
        {% endif %}
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-name" title="{{ actor.full_name }}">{{ actor.full_name }}</div>
          <div class="user-role">{{ role_name }}</div>
        </div>
        <form method="post" action="/logout">
          <button type="submit" class="btn ghost small full-width">Выйти</button>
        </form>
      </div>
    </aside>
    <main class="content">
      <header class="page-head">
        <h1>{% block page_title %}{% endblock %}</h1>
        <div class="role-badge" title="Ваша роль">{{ role_name }}</div>
      </header>
      {% for category, text in flashes %}
      <div class="flash {{ category }}">{{ text }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
