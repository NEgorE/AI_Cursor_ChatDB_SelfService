<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Доступ запрещён — ChatDB SelfService</title>
  <link rel="stylesheet" href="/static/zcode.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><span class="brand-mark">&#9656;_</span> ChatDB <span class="brand-sub">SelfService</span></div>
      <div class="blocked-icon">&#128274;</div>
      <p class="login-hint">Пользователь заблокирован,<br>обратитесь к администратору.</p>
      {% if user %}
      <p class="login-note mono">#{{ user.id }} {{ user.full_name }}</p>
      {% endif %}
      <form method="post" action="/logout"><button type="submit" class="btn ghost full-width">Выйти</button></form>
    </div>
  </main>
</body>
</html>
