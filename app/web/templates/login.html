<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ChatDB SelfService</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a191e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23e8a33d' font-family='monospace'%3E%E2%96%B8_%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/zcode.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><span class="brand-mark">&#9656;_</span> ChatDB <span class="brand-sub">SelfService</span></div>
      <p class="login-hint">Введите одноразовый код из Telegram-бота.<br>В боте: <span class="mono">/weblogin</span></p>
      {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="login-form">
        <label for="code">Код входа</label>
        <input id="code" name="code" class="code-input" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" autofocus required>
        <button type="submit" class="btn primary full-width">Войти</button>
      </form>
      <p class="login-note">Код действует 5 минут и выдаётся один на пользователя.</p>
    </div>
  </main>
  <script>
    // Автопереход фокуса и только цифры
    const codeInput = document.getElementById("code");
    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
    });
  </script>
</body>
</html>
